<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="pattyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#831843" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <linearGradient id="cheeseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Background Circle for contrast -->
  <circle cx="32" cy="32" r="30" fill="#1A0D11" stroke="#E5983B" stroke-width="2.5" />

  <!-- Top Bun -->
  <path d="M16 26 C16 16, 48 16, 48 26 Z" fill="url(#bunGrad)" />

  <!-- Sesame Seeds -->
  <ellipse cx="26" cy="20" rx="1.5" ry="0.8" fill="#FFFBEB" transform="rotate(-15 26 20)" />
  <ellipse cx="33" cy="18" rx="1.5" ry="0.8" fill="#FFFBEB" />
  <ellipse cx="39" cy="21" rx="1.5" ry="0.8" fill="#FFFBEB" transform="rotate(20 39 21)" />

  <!-- Lettuce ruffle -->
  <path d="M14 27 Q18 29 22 27 Q26 30 30 27 Q34 30 38 27 Q42 30 46 27 Q50 29 50 27" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" />

  <!-- Cheese Slice (Dripping Corner) -->
  <polygon points="17,30 47,30 42,37 32,32 23,36" fill="url(#cheeseGrad)" />

  <!-- Smashed Beef Patty -->
  <rect x="15" y="32" width="34" height="6.5" rx="3.2" fill="url(#pattyGrad)" />

  <!-- Sauce Droplet Accent -->
  <circle cx="44" cy="38" r="1.5" fill="#EF4444" />

  <!-- Bottom Bun -->
  <path d="M17 40 C17 40, 18 46, 32 46 C46 46, 47 40, 47 40 Z" fill="url(#bunGrad)" />
</svg>
