<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5A623" />
      <stop offset="100%" stop-color="#E5983B" />
    </linearGradient>
    <linearGradient id="logoRuby" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991B1B" />
      <stop offset="100%" stop-color="#6B1D2F" />
    </linearGradient>
  </defs>
  
  <!-- Outer glowing emblem hexagon or circle badge -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="#1A0D11" stroke="#E5983B" stroke-width="2" />
  
  <!-- Top Bun -->
  <path d="M12 20 C12 11 36 11 36 20 Z" fill="url(#logoGold)" />
  <!-- Sesame seeds -->
  <circle cx="20" cy="15" r="0.9" fill="#FFFFFF" opacity="0.9" />
  <circle cx="25" cy="13.5" r="0.9" fill="#FFFFFF" opacity="0.9" />
  <circle cx="29" cy="16" r="0.9" fill="#FFFFFF" opacity="0.9" />
  
  <!-- Melted cheese -->
  <path d="M11 22 H37 L33 27 L25 24 L20 27 L15 23 Z" fill="#FBBF24" />
  
  <!-- Smashed Burger Patty -->
  <rect x="10" y="25" width="28" height="5" rx="2.5" fill="url(#logoRuby)" />
  
  <!-- Crispy Lettuce wave -->
  <path d="M12 22 Q16 24 20 22 Q24 24 28 22 Q32 24 36 22" stroke="#10B981" stroke-width="2" stroke-linecap="round" fill="none" />
  
  <!-- Bottom Bun -->
  <path d="M13 32 C13 32 14 37 24 37 C34 37 35 32 35 32 Z" fill="url(#logoGold)" />
  
  <!-- Flame/Craft accent spark at top-right -->
  <path d="M37 7 C38 10 36 12 36 12 C39 11 41 8 37 7 Z" fill="#EF4444" />
</svg>
