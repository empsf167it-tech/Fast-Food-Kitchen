<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- SEO Metadata -->
  <title>404 Page Not Found — BiteCraft Fast Food</title>
  <meta name="description" content="The page you are looking for does not exist. Return to BiteCraft fast food homepage.">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <link rel="alternate icon" href="favicon.svg">

  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  
  <!-- Local Styles -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- 404 Page Content -->
  <main class="error-404-wrapper container">
    <div class="brand-logo-container mb-4">
      <a href="index.html" class="brand-logo">
        <img src="assets/images/logo.svg" alt="BiteCraft Logo" class="brand-logo-img">
        <div>
          BITECRAFT
          <span class="text-warning">FAST FOOD</span>
        </div>
      </a>
    </div>

    <span class="badge-fast-food mb-3">ERROR 404</span>
    <h1 class="display-1 font-heading text-danger mb-2" style="font-size: clamp(4rem, 15vw, 9rem);">PAGE NOT FOUND</h1>
    <h2 class="font-heading mb-3" style="font-size: clamp(1.5rem, 3vw, 2.5rem); letter-spacing: 0.05em;">
      THAT BITE ISN'T ON THE MENU!
    </h2>
    <p class="font-body mx-auto mb-5" style="max-width: 500px; opacity: 0.85; font-weight: 300;">
      The page you are looking for was moved, eaten, or typed incorrectly. Head back to our main menu for serious burger cravings.
    </p>

    <div class="d-flex gap-3 justify-content-center flex-wrap">
      <a href="index.html" class="btn-premium btn-premium-solid">RETURN HOME</a>
      <a href="menu.html" class="btn-premium btn-premium-outline">EXPLORE MENU</a>
    </div>
  </main>

  <!-- Scripts -->
  <script src="assets/js/main.js"></script>
</body>
</html>
